version: "3.8"

services:
  web:
    build:
      context: ./command_project_
      dockerfile: Dockerfile.prod
    command: gunicorn lifts_project.wsgi:application --bind 0.0.0.0:8000
    restart: always
    volumes:
      - static_volume:/home/app/web/static
      - media_volume:/home/app/web/media
      - web_logs:/home/app/web/logs
      - bot_logs:/home/app/web/bot_logs
    expose:
      - 8000
    env_file:
      - ./.env.prod_bspl

  nginx:
    build: ./nginx
    restart: always
    volumes:
      - static_volume:/home/app/web/static
      - media_volume:/home/app/web/media
      - web_logs:/home/app/web/logs
      - ./nginx/logs:/var/log/nginx
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - certbot_www:/var/www/certbot
      - certbot_conf:/etc/letsencrypt
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - web
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3

  bot:
    build:
      context: ./command_project_
      dockerfile: Dockerfile.bot

    restart: always
    volumes:
      - media_volume:/home/app/web/media
      - bot_logs:/home/app/bot/logs
    env_file:
      - ./.env.bot.prod_bspl
    depends_on:
      - web
      - nginx
  
  certbot:
    image: certbot/certbot:latest
    volumes:
      - certbot_www:/var/www/certbot
      - certbot_conf:/etc/letsencrypt
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot && sleep 12h & wait $${!}; done;'"
    # Этот entrypoint запускает бесконечный цикл проверки обновлений каждые 12 часов
    depends_on:  # <-- ДОБАВЬТЕ
      - nginx


volumes:
  postgres_data:
  static_volume:
  media_volume:
  web_logs:
  bot_logs:
  certbot_www:
  certbot_conf: