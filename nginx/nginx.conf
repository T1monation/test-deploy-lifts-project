events {
    worker_connections 1024;
}

http {
    # ============================================
    # ОСНОВНЫЕ НАСТРОЙКИ
    # ============================================
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Формат логов
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log warn;

    # Производительность
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 100M;

    # ============================================
    # UPSTREAM (Django)
    # ============================================
    upstream lifts_prodject {
        server web:8000;
    }

    # ============================================
    # HTTP (порт 80) → редирект на HTTPS
    # ============================================
    server {
        listen 80;
        server_name cikl.su www.cikl.su;

        # Certbot — должен быть ПЕРВЫМ
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Всё остальное → HTTPS
        location / {
            return 301 https://$server_name$request_uri;
        }
    }

    # ============================================
    # HTTPS (порт 443) — основной
    # ============================================
    server {
        listen 443 ssl;
        http2 on;
        server_name cikl.su www.cikl.su;

        # SSL-сертификаты Let's Encrypt
        ssl_certificate /etc/letsencrypt/live/cikl.su/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/cikl.su/privkey.pem;

        # ========================================
        # БЕЗОПАСНОСТЬ SSL
        # ========================================
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
        ssl_prefer_server_ciphers off;

        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        # HSTS
        add_header Strict-Transport-Security "max-age=15552000; includeSubDomains" always;

        # Заголовки безопасности
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "no-referrer-when-downgrade" always;

        # ========================================
        # СТАТИКА
        # ========================================
        location /static/ {
            alias /home/app/web/static/;
            expires 30d;
            add_header Cache-Control "public, immutable";
        }

        # ========================================
        # МЕДИА
        # ========================================
        location /media/ {
            alias /home/app/web/media/;
            expires 30d;
            add_header Cache-Control "public, immutable";
        }

        # ========================================
        # ОСНОВНОЕ ПРИЛОЖЕНИЕ (прокси на Django)
        # ========================================
        location / {
            proxy_pass http://lifts_prodject;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
            proxy_buffering off;
            proxy_redirect off;
        }

        # ========================================
        # CERTBOT (обновление сертификатов)
        # ========================================
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }
    }
}